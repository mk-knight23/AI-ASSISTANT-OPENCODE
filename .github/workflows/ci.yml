name: Static showcase checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test test/showcase.test.cjs
      - name: Validate shell scripts
        run: |
          if [ -d scripts ]; then find scripts -type f -name '*.sh' -exec bash -n {} +; fi
